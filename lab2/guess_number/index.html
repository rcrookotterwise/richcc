<!DOCTYPE html>
<html>
    <head>
        <title> Guess a Number </title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <header>
            <h1>Guess the Number!</h1>
            <h2>Guess a number between 1 and 99 in seven attempts!</h2>
            <h3>Wins: <span id="wins">0</span>, Losses: <span id="losses">0</span></h3>
        </header>
        
        <main>
            <br>
            <div id="main">
            Enter a guess: 
            <input type="text" id="playerGuess" size="5">         
            <button id="guessBtn"> Guess </button> <br>
            <button id="resetBtn"> Reset </button> 
            <div id="feedback"></div>
            <div>Previous Guesses:
                <span id="guesses"></span>
            </div>
            <div id="remainingAttempts"></div>
            </div>
        </main>

        <footer>
            <hr>

        </footer>

    <script src="js/scripts.js"></script>        
    </body>
</html>
