<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up Page</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="signup-wrapper">
        <section class="signup-card">
            <h1 class="text-center">Create Your Account</h1>
            <p class="signup-subtitle text-center">
                Sign up to get started.
            </p>

            <form id="signupForm" action="welcome.html">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="fName" class="form-label">First Name</label>
                        <input type="text" id="fName" name="fName"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="lName" class="form-label">Last Name</label>
                        <input type="text" id="lName" name="lName"
                               class="form-control">
                    </div>

                    <div class="col-12">
                        <fieldset>
                            <legend class="form-label">Gender</legend>

                            <div class="form-check form-check-inline">
                                <input type="radio" id="male" name="gender"
                                       value="m" class="form-check-input">
                                <label for="male" class="form-check-label">Male</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input type="radio" id="female" name="gender"
                                       value="f" class="form-check-input">
                                <label for="female" class="form-check-label">Female</label>
                            </div>
                        </fieldset>
                    </div>

                    <div class="col-md-6">
                        <label for="zip" class="form-label">Zip Code</label>
                        <input type="text" id="zip" name="zip"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="state" class="form-label">State</label>
                        <select id="state" name="state"
                                class="form-select">
                            <option value="">Loading states...</option>
                        </select>
                    </div>

                    <div class="col-12 lookup-results">
                        <p>City: <span id="city"></span></p>
                        <p>Latitude: <span id="latitude"></span></p>
                        <p>Longitude: <span id="longitude"></span></p>
                    </div>

                    <div class="col-12">
                        <label for="county" class="form-label">
                            Select a County
                        </label>
                        <select id="county" name="county"
                                class="form-select">
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="username" class="form-label">
                            Desired Username
                        </label>
                        <input type="text" id="username" name="username"
                               class="form-control">
                        <span id="usernameError"></span>
                    </div>

                    <div class="col-md-6">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input type="password" id="password" name="password"
                               class="form-control">
                        <strong id="sPwd" class="small"></strong>
                    </div>

                    <div class="col-md-6">
                        <label for="passwordAgain" class="form-label">
                            Type Password Again
                        </label>
                        <input type="password" id="passwordAgain"
                               name="passwordAgain"
                               class="form-control">
                    </div>

                    <div class="col-12">
                        <span id="passwordError"
                              class="text-danger small"></span>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">
                            Sign Up
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Richard Crook. All rights reserved.</p>
        <p>This site is for academic purposes only.</p>
        <p>CST 336 Internet Programming</p>
        <p>Lab 3, HTML Form</p>
        <img class="footer-logo" src="https://csumb.edu/media/csumb/legacy/legacy-site-images/section-editors/university-communications/updated-branding/Logo_Primary-Full-color.jpg" alt="CSUMB Logo">
    </footer>


    <script src="js/script.js"></script>
</body>
</html>
