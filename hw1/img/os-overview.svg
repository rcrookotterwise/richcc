<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">Operating system overview</title>
  <desc id="desc">Applications use services provided by an operating system, which manages computer hardware.</desc>
  <rect width="760" height="250" rx="18" fill="#f2f6f8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="70" width="175" height="110" rx="12" fill="#fff" stroke="#174f78" stroke-width="3"/>
    <text x="142" y="116" font-size="22" font-weight="700" fill="#173f73">APPLICATIONS</text>
    <text x="142" y="148" font-size="15" fill="#333">browser · games · tools</text>
    <rect x="292" y="55" width="176" height="140" rx="12" fill="#174f78"/>
    <text x="380" y="112" font-size="24" font-weight="700" fill="#fff">OPERATING</text>
    <text x="380" y="142" font-size="24" font-weight="700" fill="#fff">SYSTEM</text>
    <text x="380" y="170" font-size="14" fill="#dcebf4">coordinates resources</text>
    <rect x="530" y="70" width="175" height="110" rx="12" fill="#fff" stroke="#174f78" stroke-width="3"/>
    <text x="617" y="116" font-size="22" font-weight="700" fill="#173f73">HARDWARE</text>
    <text x="617" y="148" font-size="15" fill="#333">CPU · memory · devices</text>
    <path d="M235 125h48m-12-12 12 12-12 12M470 125h48m-12-12 12 12-12 12" fill="none" stroke="#174f78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
