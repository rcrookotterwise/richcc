    <rect x="80" y="35" width="190" height="65" rx="12" fill="#fff" stroke="#174f78" stroke-width="2"/>
    <text x="175" y="75" font-size="19" fill="#173f73">PROCESS SCHEDULING</text>
    <rect x="490" y="35" width="190" height="65" rx="12" fill="#fff" stroke="#174f78" stroke-width="2"/>
